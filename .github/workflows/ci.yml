name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # x86_64: tests AVX2 (always) + AVX-512 (on Ice Lake runners)
  test-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build (ISA dispatch = avx512 + avx2 + scalar)
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DAX_CPU_ISA_DISPATCH=ON ..
          cmake --build . -j$(nproc)

      - name: test
        run: cd build && ctest --output-on-failure

      - name: check ISA selection
        run: |
          cd build
          # the runner's xeon should select avx512
          ./test_compute 2>&1 | head -5

      - name: benchmark (optional, non-blocking)
        continue-on-error: true
        run: |
          cd build
          if [ -f bench_large ]; then
            OMP_NUM_THREADS=2 ./bench_large train-cpu 2>&1 | grep -E "epoch|median"
          fi

  # aarch64: cross-compile + QEMU correctness test for NEON kernel
  test-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static

      - name: cross-compile
        run: |
          mkdir build-arm && cd build-arm
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DAX_OPENMP=OFF ..
          cmake --build . -j$(nproc)

      - name: test via qemu (correctness only, no perf)
        run: |
          cd build-arm
          for t in test_error test_memory test_tensor test_compute test_ops; do
            echo "--- $t ---"
            qemu-aarch64-static -L /usr/aarch64-linux-gnu ./$t || true
          done

  # x86_64 + CUDA: tests GPU backend (if runner has nvidia GPU)
  test-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check for CUDA toolkit
        id: cuda
        run: |
          if command -v nvcc &>/dev/null || [ -d /usr/local/cuda ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: build (CPU-only, CUDA absent on standard runners)
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . -j$(nproc)

      - name: test
        run: cd build && ctest --output-on-failure
