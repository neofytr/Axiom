name: Bench (vs TensorFlow)

on:
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  REGRESSION_PCT: "10"

jobs:
  bench:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-benchmarks')
    name: bench (${{ matrix.isa }})
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: x86-avx2
            host: ubuntu-latest
            tf-pkg: tensorflow-cpu
            apt: ""
            cmake-extra: "-DAX_CPU_ISA_DISPATCH=ON"
          - isa: arm64-neon
            host: ubuntu-24.04-arm
            tf-pkg: tensorflow
            apt: "build-essential cmake libomp-dev python3-pip"
            cmake-extra: ""
          - isa: macos-arm64
            host: macos-14
            tf-pkg: tensorflow
            apt: ""
            cmake-extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: hardware profile
        run: |
          {
            echo "## host: ${{ matrix.isa }}"
            echo ""
            echo '### CPU'
            echo '```'
            if command -v lscpu &>/dev/null; then
              lscpu | grep -E '(Model name|Architecture|CPU\(s\)|Thread|Core|Socket|L1d|L2|L3|MHz|Flags)' | head -25
            else
              sysctl -n machdep.cpu.brand_string
              echo "cores: $(sysctl -n hw.ncpu)"
              echo "L1d: $(sysctl -n hw.l1dcachesize 2>/dev/null || echo unknown)"
              echo "L2: $(sysctl -n hw.l2cachesize 2>/dev/null || echo unknown)"
            fi
            echo '```'
            echo ''
            echo '### memory'
            echo '```'
            if command -v free &>/dev/null; then free -h; else sysctl -n hw.memsize | awk '{print $1/1073741824" GB"}'; fi
            echo '```'
          } | tee hardware.md

      - name: install apt deps
        if: matrix.apt != '' && !startsWith(matrix.host, 'macos')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}

      - name: install brew deps (macos)
        if: startsWith(matrix.host, 'macos')
        run: brew install libomp

      - name: install tensorflow
        run: pip3 install --quiet ${{ matrix.tf-pkg }} numpy

      - name: build axiom
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-extra }} ..
          cmake --build . -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: calibrate
        run: |
          AX_GEMM_CALIBRATE=1 timeout 60 ./build/bench_comprehensive >/dev/null 2>calib.log || true
          grep '^axiom:' calib.log | head -10

      - name: bench axiom (comprehensive)
        run: |
          AX_GEMM_CALIBRATE=0 timeout 300 ./build/bench_comprehensive > axiom_results.txt 2>&1

      - name: bench tensorflow (comprehensive)
        run: |
          cd benchmarks
          timeout 600 python3 bench_comprehensive_tf.py > ../tf_results.txt 2>&1

      - name: generate scoreboard
        if: always()
        run: |
          python3 -c "
          import re, sys

          def parse(path):
              results = {}
              section = ''
              with open(path) as f:
                  for line in f:
                      if line.startswith('==='):
                          section = line.strip().strip('= ')
                          continue
                      m = re.match(r'(\w+)\s+(\S+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(\S+)', line)
                      if m:
                          shape = m.group(2)
                          key = f'{section}|{shape}'
                          results[key] = float(m.group(4))
              return results

          ax = parse('axiom_results.txt')
          tf = parse('tf_results.txt')

          # normalize MHA section names
          def norm(k):
              s, sh = k.split('|', 1)
              if 'MHA' in s: s = 'MHA TRAIN'
              return f'{s}|{sh}'

          ax_n = {norm(k): v for k, v in ax.items()}
          tf_n = {norm(k): v for k, v in tf.items()}

          wins = losses = ties = total = 0
          cats = {}
          details = []

          for key in sorted(ax_n):
              if key not in tf_n: continue
              total += 1
              cat = key.split('|')[0]
              shape = key.split('|')[1]
              ratio = tf_n[key] / ax_n[key]
              if ratio > 1.02: w = 'AX'; wins += 1
              elif ratio < 0.98: w = 'TF'; losses += 1
              else: w = 'TIE'; ties += 1
              cats.setdefault(cat, [0,0,0])
              cats[cat][0 if w=='AX' else 1 if w=='TF' else 2] += 1
              details.append((cat, shape, ax_n[key], tf_n[key], ratio, w))

          with open('SCOREBOARD.md', 'w') as f:
              f.write(f'# Axiom vs TensorFlow+MKL Scoreboard\n\n')
              f.write(f'**Overall: Axiom {wins}/{total} ({100*wins//total}%) | TF {losses}/{total} | Ties {ties}/{total}**\n\n')
              f.write('| Category | AX wins | TF wins | Ties | AX% |\n')
              f.write('|----------|---------|---------|------|-----|\n')
              for cat in sorted(cats):
                  w, l, t = cats[cat]
                  tot = w+l+t
                  f.write(f'| {cat} | {w} | {l} | {t} | {100*w//tot}% |\n')
              f.write('\n## Losses (shapes where TF wins)\n\n')
              f.write('| Category | Shape | AX (us) | TF (us) | Gap |\n')
              f.write('|----------|-------|---------|---------|-----|\n')
              for cat, shape, ax_t, tf_t, ratio, w in details:
                  if w == 'TF':
                      f.write(f'| {cat} | {shape} | {ax_t:.0f} | {tf_t:.0f} | {1/ratio:.2f}x behind |\n')

          print(open('SCOREBOARD.md').read())
          print(f'\nTotal: {wins}/{total} wins ({100*wins//total}%)')
          " | tee -a scoreboard_output.txt

      - name: build report
        if: always()
        run: |
          {
            echo "# Axiom benchmarks — ${{ matrix.isa }}"
            echo ""
            cat hardware.md
            echo ""
            cat SCOREBOARD.md
          } > REPORT.md
          cat REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.isa }}
          path: |
            REPORT.md
            SCOREBOARD.md
            hardware.md
            axiom_results.txt
            tf_results.txt

  # roll up all matrix results into one summary comment
  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: bench
    if: always()
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: false

      - name: combined summary
        run: |
          echo "# Multi-platform benchmark summary" > SUMMARY.md
          echo "" >> SUMMARY.md
          for dir in bench-*/; do
            if [ -f "$dir/SCOREBOARD.md" ]; then
              echo "---" >> SUMMARY.md
              echo "" >> SUMMARY.md
              isa=$(basename "$dir" | sed 's/bench-//')
              echo "## $isa" >> SUMMARY.md
              cat "$dir/SCOREBOARD.md" >> SUMMARY.md
              echo "" >> SUMMARY.md
            fi
          done
          cat SUMMARY.md >> $GITHUB_STEP_SUMMARY
